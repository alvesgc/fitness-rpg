services:
  postgres:
    image: postgres:17
    container_name: fitness-rpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness_password
      POSTGRES_DB: fitness_rpg
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
